org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Machine-local JDK pin: Gradle 8.14 cannot run on the Android Studio
# bundled JDK 25 (Kotlin's JavaVersion parser fails on "25.0.2"). Set this
# to a local JDK 17/21/23 install, or override in ~/.gradle/gradle.properties.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
