org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Machine-local JDK pin, project-scoped only -- does not touch global
# Flutter/Android Studio config. Gradle 8.14 cannot run on the
# Android-Studio-bundled JDK 25 (Kotlin's JavaVersion parser fails on
# "25.0.2"), and this project's Kotlin targets JDK 17 bytecode.
#
# This path is for THIS (Windows) machine. The llm-test branch carried a
# macOS Homebrew path here, which silently breaks the build on Windows --
# if you build on a Mac, override it in ~/.gradle/gradle.properties rather
# than editing this line, so the two machines stop fighting over it:
#   org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-23
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
